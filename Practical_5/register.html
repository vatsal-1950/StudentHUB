<main>

<section>

<h2 align="center">Student Registration</h2>

<br>

<form id="registrationForm" novalidate>

<label for="name">Full Name</label>
<input type="text" id="name" placeholder="Enter your full name" required><small class="error" id="nameError"></small>

<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required><small class="error" id="emailError"></small>

<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter mobile number" required><small class="error" id="mobileError"></small>

<label for="course">Course</label>

<select id="course">

<option>Select Course</option>
<option>B.Tech Computer Engineering</option>
<option>B.Tech Information Technology</option>
<option>B.Tech Civil Engineering</option>
<option>B.Tech Mechanical Engineering</option>

</select>
<small class="error" id="courseError"></small>

<label for="year">Year</label>

<select id="year">

<option>First Year</option>
<option>Second Year</option>
<option>Third Year</option>
<option>Fourth Year</option>

</select>
<small class="error" id="yearError"></small>

<label>Gender</label>

<input type="radio" name="gender"> Male

<input type="radio" name="gender"> Female

<input type="radio" name="gender" value="Other"> Other
<small class="error" id="genderError"></small>

<br><br>

<label for="password">Password</label>

<input type="password" id="password" placeholder="Create Password" required><small class="error" id="passwordError"></small><div id="strengthMessage" class="strength-message"></div>

<label for="confirm">Confirm Password</label>

<input type="password" id="confirm" placeholder="Confirm Password" required><small class="error" id="confirmError"></small>

<input type="checkbox" id="terms">

I agree to the Terms & Conditions
<small class="error" id="termsError"></small>

<br><br>

<button type="submit">Register</button>

<p id="formMessage" class="form-message"></p>

</form>

</section>

</main>
